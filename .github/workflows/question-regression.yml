name: Question UI regression tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'assets/source-question-banks.json.gz.b64'
      - 'assets/persian-vocabulary.json.gz.b64'
      - 'assets/book-pages/**'
      - 'tests/**'
      - '.github/workflows/question-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  question-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse all inline JavaScript
        run: node tests/quiz-regression.mjs
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/quiz-test"
          cd "$RUNNER_TEMP/quiz-test"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Instrument temporary test page
        run: |
          node tests/instrument-test-page.mjs index.html "$RUNNER_TEMP/quiz-site/index.html"
          mkdir -p "$RUNNER_TEMP/quiz-site/assets/book-pages/persian" "$RUNNER_TEMP/quiz-site/assets/books" "$RUNNER_TEMP/quiz-site/icons"
          cp assets/source-question-banks.json.gz.b64 "$RUNNER_TEMP/quiz-site/assets/"
          cp assets/persian-vocabulary.json.gz.b64 "$RUNNER_TEMP/quiz-site/assets/"
          cp assets/book-pages/persian/page-*.webp assets/book-pages/persian/page-map.json "$RUNNER_TEMP/quiz-site/assets/book-pages/persian/"
          cp assets/books/persian-pages.pdf "$RUNNER_TEMP/quiz-site/assets/books/"
          for subject in math science social gifts quran; do
            if [ -d "assets/book-pages/$subject" ]; then
              mkdir -p "$RUNNER_TEMP/quiz-site/assets/book-pages/$subject"
              cp assets/book-pages/"$subject"/page-*.webp assets/book-pages/"$subject"/page-map.json "$RUNNER_TEMP/quiz-site/assets/book-pages/$subject/"
            fi
          done
          cp offline.js sw.js manifest.webmanifest "$RUNNER_TEMP/quiz-site/"
          cp icons/app-icon-2.png "$RUNNER_TEMP/quiz-site/icons/"
      - name: Run browser checks
        run: |
          cd "$RUNNER_TEMP/quiz-site"
          python3 -m http.server 8765 > "$RUNNER_TEMP/quiz-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/quiz-http.pid"
          cd "$RUNNER_TEMP/quiz-test"
          node "$GITHUB_WORKSPACE/tests/offline-book-cache-browser.mjs"
          node "$GITHUB_WORKSPACE/tests/persian-gallery-browser.mjs"
          if grep -Fq 'BUNDLED_COURSE_PAGE_IMAGES = true' "$GITHUB_WORKSPACE/index.html"; then
            node "$GITHUB_WORKSPACE/tests/course-book-gallery-browser.mjs"
          fi
          node "$GITHUB_WORKSPACE/tests/quiz-browser.mjs"
