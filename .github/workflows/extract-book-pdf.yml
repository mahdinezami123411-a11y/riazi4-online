name: Restore external textbook PDF

on:
  push:
    branches: [main]
    paths:
      - "legacy-index-with-pdf.html"
      - ".github/workflows/extract-book-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and validate embedded PDF
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('legacy-index-with-pdf.html', 'utf8');
          const match = html.match(/const\s+textbookBase64\s*=\s*"([A-Za-z0-9+/=]+)"/);
          if (!match) throw new Error('Could not find embedded textbook PDF data.');
          const pdf = Buffer.from(match[1], 'base64');
          if (pdf.subarray(0, 5).toString('ascii') !== '%PDF-') {
            throw new Error('Extracted data is not a valid PDF.');
          }
          fs.mkdirSync('assets', { recursive: true });
          fs.writeFileSync('assets/math-fourth.pdf', pdf);
          console.log('Extracted and validated PDF:', pdf.length, 'bytes');
          NODE
      - name: Commit PDF asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/math-fourth.pdf
          if git diff --cached --quiet; then
            echo "PDF asset already up to date."
            exit 0
          fi
          git commit -m "Add external mathematics textbook PDF asset"
          git push
