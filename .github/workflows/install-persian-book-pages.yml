name: Install Persian textbook page assets

on:
  push:
    branches: [main]
    paths:
      - 'persian-book-pages-assets.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write

jobs:
  install-book-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate and extract the textbook pages
        shell: bash
        run: |
          set -euo pipefail
          test -f persian-book-pages-assets.zip || {
            echo 'Upload persian-book-pages-assets.zip to the repository root first.' >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/persian-book-assets"
          unzip -oq persian-book-pages-assets.zip -d "$RUNNER_TEMP/persian-book-assets"
          ASSET_ROOT="$RUNNER_TEMP/persian-book-assets"
          test -f "$ASSET_ROOT/assets/book-pages/persian/page-map.json"
          test -f "$ASSET_ROOT/assets/books/persian-pages.pdf"
          count=$(find "$ASSET_ROOT/assets/book-pages/persian" -maxdepth 1 -type f -name 'page-*.webp' | wc -l)
          test "$count" -eq 85 || {
            echo "Expected 85 WebP page images; found $count." >&2
            exit 1
          }
          mkdir -p assets/book-pages/persian assets/books
          cp -a "$ASSET_ROOT/assets/book-pages/persian/." assets/book-pages/persian/
          cp "$ASSET_ROOT/assets/books/persian-pages.pdf" assets/books/persian-pages.pdf
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const map = JSON.parse(fs.readFileSync('assets/book-pages/persian/page-map.json', 'utf8'));
          if (Object.keys(map).length !== 17) throw new Error('Expected page mappings for all 17 Persian lessons.');
          let expected = 0;
          for (const [lesson, info] of Object.entries(map)) {
            if (!Number.isInteger(info.printedStart) || !Number.isInteger(info.printedEnd) || info.printedEnd < info.printedStart) {
              throw new Error('Invalid page range for lesson ' + lesson);
            }
            for (let page = info.printedStart; page <= info.printedEnd; page++) {
              const file = path.join('assets/book-pages/persian', 'page-' + String(page).padStart(3, '0') + '.webp');
              if (!fs.existsSync(file)) throw new Error('Missing image for printed page ' + page + ' (lesson ' + lesson + ')');
              expected++;
            }
          }
          if (expected !== 85) throw new Error('Expected 85 mapped pages, got ' + expected);
          console.log('Validated ' + expected + ' textbook page images across ' + Object.keys(map).length + ' lessons.');
          NODE

      - name: Enable the verified pages and update PWA cache version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let html = fs.readFileSync('index.html', 'utf8');
          let sw = fs.readFileSync('sw.js', 'utf8');
          const bundledAssets = /const\s+BUNDLED_BOOK_ASSETS\s*=\s*new Set\(\[([^\]]*)\]\);/;
          const assetMatch = html.match(bundledAssets);
          if (!assetMatch) throw new Error('Could not find BUNDLED_BOOK_ASSETS in index.html');
          if (!assetMatch[1].includes("'./assets/books/persian-pages.pdf'")) {
            const values = assetMatch[1].trim();
            html = html.replace(bundledAssets, "const BUNDLED_BOOK_ASSETS = new Set([" + values + ", './assets/books/persian-pages.pdf']);");
          }
          if (/const\s+BUNDLED_PERSIAN_PAGE_IMAGES\s*=\s*false\s*;/.test(html)) {
            html = html.replace(/const\s+BUNDLED_PERSIAN_PAGE_IMAGES\s*=\s*false\s*;/, 'const BUNDLED_PERSIAN_PAGE_IMAGES = true;');
          } else if (!/const\s+BUNDLED_PERSIAN_PAGE_IMAGES\s*=\s*true\s*;/.test(html)) {
            throw new Error('Could not safely locate the Persian page-image feature switch.');
          }
          const registration = /(serviceWorker\.register\(['"]\.\/sw\.js\?v=202610\d+-v)(\d+)(['"])/;
          const cacheName = /(const\s+CACHE_NAME\s*=\s*['"]riazi4-pwa-shell-v)(\d+)(['"])/;
          const registrationMatch = html.match(registration);
          const cacheMatch = sw.match(cacheName);
          if (!registrationMatch || !cacheMatch) throw new Error('Could not find PWA cache version strings.');
          if (registrationMatch[2] !== cacheMatch[2]) throw new Error('PWA registration and cache versions were already out of sync.');
          const next = String(Number(registrationMatch[2]) + 1);
          html = html.replace(registration, (_full, prefix, _old, quote) => prefix + next + quote);
          sw = sw.replace(cacheName, (_full, prefix, _old, quote) => prefix + next + quote);
          fs.writeFileSync('index.html', html);
          fs.writeFileSync('sw.js', sw);
          console.log('Persian book pages enabled; PWA cache bumped to v' + next + '.');
          NODE

      - name: Commit the pages and remove the upload bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/book-pages/persian assets/books/persian-pages.pdf index.html sw.js
          git rm --ignore-unmatch persian-book-pages-assets.zip
          if git diff --cached --quiet; then
            echo 'No page assets changed.'
            exit 0
          fi
          git commit -m 'Add lesson-specific Persian textbook pages'
          git push

      - name: Request a GitHub Pages rebuild and rerun regression tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"; then
            echo 'Requested a GitHub Pages rebuild.'
          else
            echo 'Assets are committed. If Pages does not redeploy automatically, start a new Pages deployment from Actions.'
          fi
          gh workflow run question-regression.yml --ref main || echo 'Could not dispatch the regression workflow automatically.'
